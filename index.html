<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .app { text-align: center; width: 100%; max-width: 420px; padding: 24px 16px; }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: .06em;
    color: #e2e8f0;
    margin-bottom: 4px;
  }

  .screen-label { color: #718096; font-size: 14px; margin: 8px 0 24px; }

  /* ── Mode & symbol pickers ── */
  .mode-btns { display: flex; gap: 12px; justify-content: center; }
  .mode-btn {
    flex: 1;
    padding: 20px 12px;
    border: 2px solid #2d3748;
    border-radius: 12px;
    background: #1a202c;
    color: #e2e8f0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .mode-btn:hover { border-color: #4a90d9; background: #1e2a3a; }
  .mode-btn .icon { font-size: 32px; display: block; margin-bottom: 8px; }

  .symbol-btn .sym-glyph { font-size: 44px; display: block; margin-bottom: 6px; line-height: 1; }
  .symbol-btn.x-btn:hover { border-color: #fc8181; background: rgba(252,129,129,.08); }
  .symbol-btn.o-btn:hover { border-color: #63b3ed; background: rgba(99,179,237,.08); }

  /* ── Score bar ── */
  #game-screen { display: none; }

  .score-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 8px;
  }
  .score-box {
    flex: 1;
    background: #1a202c;
    border: 2px solid #2d3748;
    border-radius: 10px;
    padding: 10px 8px;
    transition: border-color .2s;
  }
  .score-box.active { border-color: #4a90d9; }
  .score-box .label { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #718096; margin-bottom: 2px; }
  .score-box .name  { font-size: 13px; font-weight: 600; color: #e2e8f0; }
  .score-box .val   { font-size: 26px; font-weight: 700; color: #e2e8f0; line-height: 1; margin-top: 2px; }
  .score-box.x-box .val { color: #fc8181; }
  .score-box.o-box .val { color: #63b3ed; }
  .score-divider { font-size: 11px; color: #4a5568; font-weight: 700; flex-shrink: 0; }

  /* ── Status ── */
  .status {
    font-size: 15px;
    font-weight: 600;
    min-height: 28px;
    margin-bottom: 16px;
    color: #a0aec0;
    transition: color .2s;
  }
  .status.winner-x { color: #fc8181; }
  .status.winner-o { color: #63b3ed; }
  .status.draw     { color: #f6ad55; }

  /* ── Board ── */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .cell {
    aspect-ratio: 1;
    background: #1a202c;
    border: 2px solid #2d3748;
    border-radius: 10px;
    font-size: 48px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .12s, border-color .12s, transform .08s;
    user-select: none;
  }
  .cell:hover:not(.taken):not(.locked) { background: #242c3a; border-color: #4a5568; }
  .cell.x { color: #fc8181; }
  .cell.o { color: #63b3ed; }
  .cell.win-cell-x {
    background: rgba(252,129,129,.15);
    border-color: #fc8181;
    animation: win-pulse-x 1s ease-in-out infinite;
  }
  .cell.win-cell-o {
    background: rgba(99,179,237,.15);
    border-color: #63b3ed;
    animation: win-pulse-o 1s ease-in-out infinite;
  }
  @keyframes win-pulse-x {
    0%,100% { box-shadow: 0 0 0 0 rgba(252,129,129,0); }
    50%     { box-shadow: 0 0 18px 5px rgba(252,129,129,.45); }
  }
  @keyframes win-pulse-o {
    0%,100% { box-shadow: 0 0 0 0 rgba(99,179,237,0); }
    50%     { box-shadow: 0 0 18px 5px rgba(99,179,237,.45); }
  }
  .cell.taken { cursor: default; }
  .cell.locked { cursor: default; pointer-events: none; }
  .cell.pop { animation: pop .15s ease-out; }
  @keyframes pop {
    0%   { transform: scale(.7); }
    70%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* ── Buttons ── */
  .btn-row { display: flex; gap: 10px; justify-content: center; }
  .btn {
    padding: 9px 20px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-primary { background: #2b6cb0; color: #fff; }
  .btn-primary:hover { background: #3182ce; }
  .btn-ghost { background: #1a202c; color: #718096; border: 1.5px solid #2d3748; }
  .btn-ghost:hover { background: #242c3a; color: #a0aec0; }

  /* ── Thinking indicator ── */
  .thinking { color: #4a5568; font-size: 12px; height: 16px; margin-top: -12px; margin-bottom: 8px; }

  /* Confetti canvas */
  #confetti-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
  }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="app">
  <h1>Tic-Tac-Toe</h1>

  <!-- Mode selection -->
  <div id="mode-screen">
    <p class="screen-label">Choose a mode to start</p>
    <div class="mode-btns">
      <button class="mode-btn" onclick="pickMode('cpu')">
        <span class="icon">🤖</span>vs Computer
      </button>
      <button class="mode-btn" onclick="pickMode('2p')">
        <span class="icon">👥</span>2 Players
      </button>
    </div>
  </div>

  <!-- Symbol selection (cpu only) -->
  <div id="symbol-screen" style="display:none">
    <p class="screen-label">Play as…</p>
    <div class="mode-btns">
      <button class="mode-btn symbol-btn x-btn" onclick="pickSymbol('X')">
        <span class="sym-glyph" style="color:#fc8181">✕</span>
        X &nbsp;·&nbsp; Go first
      </button>
      <button class="mode-btn symbol-btn o-btn" onclick="pickSymbol('O')">
        <span class="sym-glyph" style="color:#63b3ed">○</span>
        O &nbsp;·&nbsp; Go second
      </button>
    </div>
    <button class="btn btn-ghost" style="margin-top:16px" onclick="show('mode-screen')">← Back</button>
  </div>

  <!-- Game -->
  <div id="game-screen">
    <div class="score-bar">
      <div class="score-box x-box" id="score-x">
        <div class="label" id="label-x">PLAYER</div>
        <div class="name" id="name-x">X</div>
        <div class="val" id="val-x">0</div>
      </div>
      <div class="score-divider">DRAWS<br><span id="val-d" style="font-size:20px;font-weight:700;color:#a0aec0">0</span></div>
      <div class="score-box o-box" id="score-o">
        <div class="label" id="label-o">PLAYER</div>
        <div class="name" id="name-o">O</div>
        <div class="val" id="val-o">0</div>
      </div>
    </div>

    <div class="status" id="status"></div>
    <div class="thinking" id="thinking"></div>

    <div class="board" id="board">
      <div class="cell" onclick="move(0)"></div>
      <div class="cell" onclick="move(1)"></div>
      <div class="cell" onclick="move(2)"></div>
      <div class="cell" onclick="move(3)"></div>
      <div class="cell" onclick="move(4)"></div>
      <div class="cell" onclick="move(5)"></div>
      <div class="cell" onclick="move(6)"></div>
      <div class="cell" onclick="move(7)"></div>
      <div class="cell" onclick="move(8)"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="resetBoard()">New Game</button>
      <button class="btn btn-ghost" onclick="show('mode-screen')">Change Mode</button>
    </div>
  </div>
</div>

<script>
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let board, current, gameOver, mode, scores;
let playerSymbol = 'X', cpuSymbol = 'O';

function show(id) {
  ['mode-screen','symbol-screen','game-screen'].forEach(s =>
    document.getElementById(s).style.display = s === id ? 'block' : 'none'
  );
}

function pickMode(m) {
  mode = m;
  scores = { X: 0, O: 0, D: 0 };
  if (m === 'cpu') {
    show('symbol-screen');
  } else {
    playerSymbol = 'X'; cpuSymbol = 'O';
    document.getElementById('label-x').textContent = 'PLAYER 1';
    document.getElementById('label-o').textContent = 'PLAYER 2';
    document.getElementById('name-x').textContent = 'X';
    document.getElementById('name-o').textContent = 'O';
    show('game-screen');
    resetBoard();
  }
}

function pickSymbol(sym) {
  playerSymbol = sym;
  cpuSymbol = sym === 'X' ? 'O' : 'X';

  // Score box labels — X column is always X, O column is always O
  if (playerSymbol === 'X') {
    document.getElementById('label-x').textContent = 'YOU';
    document.getElementById('label-o').textContent = 'CPU';
    document.getElementById('name-x').textContent = 'X';
    document.getElementById('name-o').textContent = 'O';
  } else {
    document.getElementById('label-x').textContent = 'CPU';
    document.getElementById('label-o').textContent = 'YOU';
    document.getElementById('name-x').textContent = 'X';
    document.getElementById('name-o').textContent = 'O';
  }
  show('game-screen');
  resetBoard();
}

function resetBoard() {
  board = Array(9).fill(null);
  current = 'X';
  gameOver = false;
  document.querySelectorAll('.cell').forEach(c => { c.textContent = ''; c.className = 'cell'; });
  document.getElementById('thinking').textContent = '';
  updateScoreDisplay();

  // If player chose O, CPU (X) moves first
  if (mode === 'cpu' && cpuSymbol === 'X') {
    setStatus('');
    lockBoard(true);
    document.getElementById('thinking').textContent = 'thinking…';
    setTimeout(() => {
      document.getElementById('thinking').textContent = '';
      placeMove(bestMove(board), cpuSymbol);
      lockBoard(false);
    }, 400);
  } else {
    setStatus(mode === 'cpu' ? 'Your turn' : "Player 1 (X)'s turn");
    updateScoreHighlight();
  }
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function updateScoreHighlight() {
  document.getElementById('score-x').classList.toggle('active', current === 'X' && !gameOver);
  document.getElementById('score-o').classList.toggle('active', current === 'O' && !gameOver);
}

function updateScoreDisplay() {
  document.getElementById('val-x').textContent = scores.X;
  document.getElementById('val-o').textContent = scores.O;
  document.getElementById('val-d').textContent  = scores.D;
}

function move(i) {
  if (gameOver || board[i]) return;
  if (mode === 'cpu' && current === cpuSymbol) return;
  placeMove(i, current);
  if (!gameOver && mode === 'cpu') {
    lockBoard(true);
    document.getElementById('thinking').textContent = 'thinking…';
    setTimeout(() => {
      document.getElementById('thinking').textContent = '';
      placeMove(bestMove(board), cpuSymbol);
      lockBoard(false);
    }, 250);
  }
}

function placeMove(i, player) {
  board[i] = player;
  const cell = document.querySelectorAll('.cell')[i];
  cell.textContent = player === 'X' ? '✕' : '○';
  cell.classList.add(player.toLowerCase(), 'taken', 'pop');

  const win = checkWin(board);
  if (win) {
    const winCells = win.map(idx => document.querySelectorAll('.cell')[idx]);
    winCells.forEach(c => c.classList.add('win-cell-' + player.toLowerCase()));
    gameOver = true;
    lockBoard(true);
    let label;
    if (mode === 'cpu') {
      label = player === playerSymbol ? 'You win! 🎉' : 'CPU wins';
    } else {
      label = `Player ${player === 'X' ? '1' : '2'} wins!`;
    }
    setStatus(label, player === 'X' ? 'winner-x' : 'winner-o');
    scores[player]++;
    updateScoreDisplay();
    triggerConfetti(player, winCells);
  } else if (board.every(Boolean)) {
    gameOver = true;
    lockBoard(true);
    setStatus("It's a draw", 'draw');
    scores.D++;
    updateScoreDisplay();
  } else {
    current = player === 'X' ? 'O' : 'X';
    if (mode === 'cpu') {
      setStatus(current === playerSymbol ? 'Your turn' : '');
    } else {
      setStatus(`Player ${current === 'X' ? '1 (X)' : '2 (O)'}'s turn`);
    }
    updateScoreHighlight();
  }
}

function lockBoard(lock) {
  document.querySelectorAll('.cell').forEach(c => {
    if (lock) c.classList.add('locked');
    else if (!c.classList.contains('taken')) c.classList.remove('locked');
  });
}

function checkWin(b) {
  for (const [a, bb, c] of WINS) {
    if (b[a] && b[a] === b[bb] && b[a] === b[c]) return [a, bb, c];
  }
  return null;
}

/* Minimax — always maximizes for cpuSymbol */
function scoreBoard(b, depth) {
  const w = checkWin(b);
  if (w) return b[w[0]] === cpuSymbol ? 10 - depth : depth - 10;
  return 0;
}

function minimax(b, depth, isCpuTurn, alpha, beta) {
  const s = scoreBoard(b, depth);
  if (s !== 0 || b.every(Boolean)) return s;
  if (isCpuTurn) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = cpuSymbol;
      best = Math.max(best, minimax(b, depth + 1, false, alpha, beta));
      b[i] = null;
      alpha = Math.max(alpha, best);
      if (beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = playerSymbol;
      best = Math.min(best, minimax(b, depth + 1, true, alpha, beta));
      b[i] = null;
      beta = Math.min(beta, best);
      if (beta <= alpha) break;
    }
    return best;
  }
}

function bestMove(b) {
  let best = -Infinity, mv = -1;
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = cpuSymbol;
    const v = minimax(b, 0, false, -Infinity, Infinity);
    b[i] = null;
    if (v > best) { best = v; mv = i; }
  }
  return mv;
}

function triggerConfetti(player, winCells) {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const palette = player === 'X'
    ? ['#fc8181','#f56565','#feb2b2','#fbd38d','#ffffff','#fc814a']
    : ['#63b3ed','#4299e1','#90cdf4','#76e4f7','#ffffff','#b794f4'];

  const origins = winCells.map(c => {
    const r = c.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  });

  const particles = [];
  origins.forEach(o => {
    for (let i = 0; i < 45; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 10 + 3;
      particles.push({
        x: o.x, y: o.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        size: Math.random() * 9 + 4,
        color: palette[Math.floor(Math.random() * palette.length)],
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.25,
        shape: Math.random() < 0.6 ? 'rect' : 'circle',
      });
    }
  });

  const duration = 2600;
  let start = null;
  function draw(ts) {
    if (!start) start = ts;
    const elapsed = ts - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const progress = elapsed / duration;
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.38; p.vx *= 0.985; p.rot += p.rotV;
      const alpha = Math.max(0, 1 - progress * 1.2);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (p.shape === 'rect') ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      else { ctx.beginPath(); ctx.arc(0, 0, p.size/2, 0, Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    if (elapsed < duration) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(draw);
}
</script>
</body>
</html>
