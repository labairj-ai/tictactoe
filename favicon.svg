<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="5" fill="#1a202c"/>
  <!-- Grid lines -->
  <line x1="11" y1="3" x2="11" y2="29" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="3" x2="21" y2="29" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="3"  y1="11" x2="29" y2="11" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="3"  y1="21" x2="29" y2="21" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round"/>
  <!-- X top-left -->
  <line x1="4.5" y1="4.5" x2="9.5" y2="9.5" stroke="#fc8181" stroke-width="2" stroke-linecap="round"/>
  <line x1="9.5" y1="4.5" x2="4.5" y2="9.5" stroke="#fc8181" stroke-width="2" stroke-linecap="round"/>
  <!-- O top-right -->
  <circle cx="25" cy="7" r="3" fill="none" stroke="#63b3ed" stroke-width="2"/>
  <!-- O middle-left -->
  <circle cx="6" cy="16" r="3" fill="none" stroke="#63b3ed" stroke-width="2"/>
  <!-- X center -->
  <line x1="13.5" y1="13.5" x2="18.5" y2="18.5" stroke="#fc8181" stroke-width="2" stroke-linecap="round"/>
  <line x1="18.5" y1="13.5" x2="13.5" y2="18.5" stroke="#fc8181" stroke-width="2" stroke-linecap="round"/>
  <!-- X bottom-right — completes winning diagonal, glowing red -->
  <line x1="22.5" y1="22.5" x2="27.5" y2="27.5" stroke="#fc8181" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="27.5" y1="22.5" x2="22.5" y2="27.5" stroke="#fc8181" stroke-width="2.2" stroke-linecap="round"/>
</svg>
